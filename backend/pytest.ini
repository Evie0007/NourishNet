[pytest]
testpaths = tests

# Every timestamp in this codebase goes through datetime.utcnow(), which
# Python 3.12 deprecated. NFR-4.7.5 already records that as a known gap
# with a planned fix; until it is done, the warning fires several hundred
# times per run and buries anything new. Filtered here rather than fixed
# piecemeal, so that migration stays one deliberate change.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning
