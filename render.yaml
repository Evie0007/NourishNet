# Render Blueprint for the NourishNet API.
#
# Render reads this from the repo root. In the dashboard: New → Blueprint,
# point it at github.com/Evie0007/NourishNet, and it creates the service
# below. Values marked `sync: false` are NOT stored in this file — Render
# prompts for them at deploy time, which is how secrets stay out of git.

services:
  - type: web
    name: nourishnet-api
    runtime: python
    plan: free
    # Oregon is the closest Render region to the Supabase us-east-2 pooler
    # among the free-plan options; move both together if you ever care about
    # the round trip.
    region: oregon

    # The Python app lives in backend/; the repo root holds this file, the
    # React app, and the docs. Every command below runs inside this
    # directory, which is why they still read as if backend/ were the root.
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    # Brings an existing database up to the current schema before the app
    # starts. `create_all` at startup adds missing tables but never a column
    # to a table that already exists, so without this an older database
    # serves its first request against columns that aren't there.
    # Idempotent — a no-op once the database is current.
    preDeployCommand: python -m scripts.upgrade_schema

    # One worker. The expiration sweep runs inside the web process, and each
    # worker would run its own copy: harmless (the sweep is idempotent) but
    # pointless. Add workers and the sweeps multiply; move to a Render cron
    # service running `python -m scripts.sweep` with SWEEP_ENABLED=false
    # before scaling this out.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Render polls this to decide the deploy succeeded. Without it, a service
    # that boots but can't serve still shows as live.
    healthCheckPath: /health

    envVars:
      # Supabase connection string. Use the POOLER host
      # (…pooler.supabase.com), not the direct db.… host — the direct one is
      # IPv6-only and Render cannot reach it.
      - key: DATABASE_URL
        sync: false

      # Render generates a strong random value on first deploy. Do not reuse
      # the local dev secret. Changing it signs everyone out, which is the
      # correct behavior if it ever leaks.
      - key: JWT_SECRET
        generateValue: true

      # Comma-separated list of frontend origins allowed to call this API.
      # Not a secret — it's the public Vercel URL — so it lives here rather
      # than being typed into the dashboard. Exact origin match: https://,
      # no trailing slash, no path.
      - key: CORS_ORIGINS
        value: "https://nourish-net-coral.vercel.app"

      # Token lifetimes, in hours (FR-1.5).
      - key: STAFF_TOKEN_HOURS
        value: "8"
      - key: ORG_TOKEN_HOURS
        value: "24"

      # The automatic expiration sweep (FR-10.2 asks for no more than five
      # minutes between runs). Note the free plan spins a service down when
      # idle — a sleeping service sweeps nothing, and catches up in one pass
      # when the next request wakes it.
      - key: SWEEP_ENABLED
        value: "true"
      - key: SWEEP_INTERVAL_SECONDS
        value: "60"

      # External UPC lookup for barcodes the catalog doesn't know. Off: the
      # intake desk must not wait on a third-party API.
      - key: UPC_LOOKUP_ENABLED
        value: "false"
